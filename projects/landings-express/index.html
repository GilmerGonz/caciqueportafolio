<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Express — Cacique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F5F5F5; color: #0A0A0A; }
    h1, h2, h3 { font-family: 'Barlow Condensed', sans-serif; }
    .hard-shadow { box-shadow: 6px 6px 0px #000000; }
  </style>
</head>
<body class="p-6 md:p-12">
  <div class="max-w-4xl mx-auto border-2 border-[#0A0A0A] bg-white p-8 hard-shadow">
    <div class="flex justify-between items-center border-b-2 border-[#0A0A0A] pb-4 mb-6">
      <span class="font-bold text-xs uppercase tracking-widest border border-[#0A0A0A] px-2 py-1 bg-[#F5F5F5]">EDICIÓN EXPRES</span>
      <span class="text-xs font-mono text-[#555]">ENTREGA EN 3 DÍAS</span>
    </div>
    <h1 class="text-4xl md:text-6xl font-black uppercase leading-none mb-4">
      LANDING PAGE DE ALTA CONVERSIÓN
    </h1>
    <p class="text-[#555] text-lg mb-8 max-w-2xl">
      Diseño suizo sin distracciones ni adornos. Construido para capturar leads instantáneamente y posicionar marcas venezolanas en el mercado global.
    </p>
    <div class="flex gap-4">
      <button class="bg-[#0A0A0A] text-white px-6 py-3 font-bold uppercase text-sm rounded hard-shadow">HABLAR CON UN EXPERTO</button>
      <button class="border-2 border-[#0A0A0A] text-[#0A0A0A] px-6 py-3 font-bold uppercase text-sm rounded">VER SERVICIOS</button>
    </div>
  </div>

<!-- CACIQUE GLOBAL ESC MODAL CLOSER -->
<script>
  (function() {
    function handleEsc(e) {
      if (e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27) {
        try {
          if (window.parent && typeof window.parent.closeDemoModal === 'function') {
            window.parent.closeDemoModal();
          }
          if (window.parent && typeof window.parent.closeContactModal === 'function') {
            window.parent.closeContactModal();
          }
        } catch (err) {}
      }
    }
    window.addEventListener('keydown', handleEsc, true);
    document.addEventListener('keydown', handleEsc, true);
  })();
</script>

</body>
</html>
